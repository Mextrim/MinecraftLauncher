[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2.9", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
md-5 = "0.10"
uuid = { version = "1.6", features = ["v3", "v4"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
